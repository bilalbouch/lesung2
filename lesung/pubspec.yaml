name: lesung
description: >-
  Lesung — moteur de recherche de livres.
  Package Dart pur : aucune dependance Flutter, le moteur est entierement
  independant de l'application et testable avec `dart test`.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  http: ^1.2.0
  html: ^0.15.4
  crypto: ^3.0.7
  archive: ^3.6.1
  xml: ^6.5.0

dev_dependencies:
  test: ^1.25.0
